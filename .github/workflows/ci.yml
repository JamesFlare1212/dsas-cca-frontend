name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run format:check

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image-id: ${{ steps.export.outputs.image-id }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment configurations
        run: |
          sh -n scripts/test-container.sh
          docker compose --env-file example.env config --quiet
          docker compose --env-file example.env --project-name dsas-cca-frontend-local -f docker-compose.yaml -f docker-compose.build.yaml config --quiet
          mkdir -p "$RUNNER_TEMP/watchtower-auth"
          printf '{}\n' > "$RUNNER_TEMP/watchtower-auth/config.json"
          WATCHTOWER_AUTH_DIR="$RUNNER_TEMP/watchtower-auth" docker compose --env-file example.env -f docker-compose.yaml -f docker-compose.auth.yaml config --quiet
      - name: Build production image
        run: |
          docker build --pull --tag dsas-cca-frontend:ci \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Verify pages, HTTP 404, caching, health, and gzip without network access
        run: sh scripts/test-container.sh dsas-cca-frontend:ci
      - name: Export the tested image for publication
        id: export
        if: >-
          github.event_name == 'push' &&
          github.repository == 'JamesFlare1212/dsas-cca-frontend' &&
          !github.event.repository.fork &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' dsas-cca-frontend:ci)
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          docker save dsas-cca-frontend:ci | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - name: Upload the tested image
        id: upload
        if: steps.export.outputs.image-id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [check, container-smoke]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'JamesFlare1212/dsas-cca-frontend' &&
      !github.event.repository.fork &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jamesflare1212/dsas-cca-frontend
    steps:
      - name: Download the tested image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.container-smoke.outputs.artifact-id }}
          path: ${{ runner.temp }}/tested-image
          merge-multiple: true
      - name: Load and verify the tested image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.container-smoke.outputs.image-id }}
        run: |
          gzip -dc "$RUNNER_TEMP/tested-image/image.tar.gz" | docker load
          test "$(docker image inspect --format '{{.Id}}' dsas-cca-frontend:ci)" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' dsas-cca-frontend:ci)" = "$GITHUB_SHA"
      - name: Publish commit and deployment tags to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for tag in "sha-$GITHUB_SHA" latest; do
            docker tag dsas-cca-frontend:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
